[project]
name = "ref-gages-bulk"
version = "0.1.0"
description = "Geoconnex bulk JSON-LD export of reference gages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pyshacl>=0.30.1",
    "pyright>=1.1.408",
    "pytest>=8.4.0",
    "ruff>=0.15.8",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["src"]
